<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureID - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="brand-sidebar">
    <div class="brand-icon">🔐</div>
    <h2>SecureID</h2>
    <p>Secure access to your account</p>
    <p class="footer-note">© 2026 SecureID. All rights reserved.</p>
</div>
    <div class="card">
        <div class="logo">🔐</div>
        <h1>Create Account</h1>
        <p class="subtitle">Sign up to get started</p>

        <div id="alertBox"></div>

    <form id="registrationForm">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 6 characters" required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Sign Up</button>
    </form>
    </div>
</div>

    <script src="js/auth.js"></script>
    <script src="js/registration.js"></script>
</body>
</html>
